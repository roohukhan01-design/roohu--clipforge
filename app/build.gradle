plugins {
    id 'com.android.application'
}

android {
    namespace 'com.roohu.clipforge'
    compileSdk 34

    defaultConfig {
        applicationId 'com.roohu.clipforge'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 1.8+ merged the JDK7/JDK8 extensions into kotlin-stdlib.
// Exclude legacy split artifacts pulled by older transitive dependencies
// to prevent duplicate classes during Android packaging.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}